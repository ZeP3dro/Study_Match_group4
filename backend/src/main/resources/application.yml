spring:
  application:
    name: studymatch-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${DB_PORT:3308}/studymatch_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:studymatch_user}
    password: ${DB_PASSWORD:studymatch_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
